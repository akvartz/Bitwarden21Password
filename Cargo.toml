[package]
name = "pwmigrate"
version = "0.2.0"
authors = ["AK"]
edition = "2021"
description = "Universal password manager migration tool: convert, verify and inspect vault export files across popular password managers."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[[bin]]
name = "pwmigrate"
path = "src/main.rs"
